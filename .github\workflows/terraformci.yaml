name: AWS OIDC Authentication

on:
  push:
    branches:
      - main

jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # This is crucial for requesting the OIDC ID token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::043309337957:role/oidc-github-fin # Replace with your Role ARN
          aws-region: us-east-1 # Replace with your desired AWS region
          role-session-name: oidc-github-fin

      - name: Run AWS CLI command to verify access
        run: aws s3 ls # This command will list S3 buckets if authentication works
