# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      environment:
         required: true
         type: choice
         options:
           - dev
           - staging



# # A workflow run is made up of one or more jobs that can run sequentially or in parallel
# jobs:
#   # This workflow contains a single job called "build"
#   build:
#     # The type of runner that the job will run on
#     runs-on: ubuntu-latest

#     # Steps represent a sequence of tasks that will be executed as part of the job
#     steps:
#       # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
#       - uses: actions/checkout@v4

#       # Runs a single command using the runners shell
#       - name: Run a one-line script
#         run: echo Hello, world!

#       # Runs a set of commands using the runners shell
#       - name: Run a multi-line script
#         run: |
#           echo Add other actions to build,
#           echo test, and deploy your project.

jobs:
  test-aws-oidc:
    name: deploy ${{ inputs.environment}} || 'dev' }}
    runs-on: ubuntu-latest
    environment : ${{ inputs.environment}} || 'dev' }}
    permissions:
      contents: read
      id-token: write # This is crucial for requesting the OIDC ID token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::627528668941:role/github-oidc-dev # Replace with your Role ARN
          aws-region: us-east-1 # Replace with your desired AWS region


      - name: Run AWS CLI command to verify access
        run: aws s3 ls # This command will list S3 buckets if authentication works
